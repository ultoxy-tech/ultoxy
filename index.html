<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Primary SEO Meta Tags -->
    <title>Ultoxy Technologies | Custom Software, Web & Mobile App Development Company in Pune, India</title>
    <meta
      name="description"
      content="Ultoxy Technologies is a premier IT & software development company in Pune, India specializing in custom website development, Flutter mobile apps, enterprise ERP software, digital marketing, and technical SEO."
    />
    <meta
      name="keywords"
      content="Ultoxy Technologies, software development company Pune, website development India, mobile app development Flutter, custom ERP software, digital marketing agency Pune, SEO services India, React Django development"
    />
    <meta name="author" content="Ultoxy Technologies" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ultoxy.com" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ultoxy Technologies" />
    <meta
      property="og:title"
      content="Ultoxy Technologies | Innovative Digital & Software Solutions"
    />
    <meta
      property="og:description"
      content="Elevate your business with Ultoxy Technologies — specialists in web & software development, mobile app creation, enterprise ERP, digital marketing, and SEO."
    />
    <meta property="og:image" content="https://ultoxy.com/logo.png" />
    <meta property="og:url" content="https://ultoxy.com" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Ultoxy Technologies | Digital & Software Development Experts"
    />
    <meta
      name="twitter:description"
      content="We build high-performing websites, mobile apps, custom ERP software, and growth strategies to elevate your business."
    />
    <meta name="twitter:image" content="https://ultoxy.com/logo.png" />

    <!-- Theme Color (Default Light Mode) -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Google Fonts: Outfit (Sleek Creative Display), DM Sans (Clean UI) & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD) for Indian IT & Software Company SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Ultoxy Technologies",
        "alternateName": "Ultoxy",
        "url": "https://ultoxy.com",
        "logo": "https://ultoxy.com/logo.png",
        "slogan": "Elevate Everything With Ultoxy",
        "description": "Ultoxy Technologies delivers professional website development, mobile app development, custom ERP & desktop software, digital marketing, and SEO optimization.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Pune",
          "addressRegion": "Maharashtra",
          "addressCountry": "IN"
        },
        "email": "info@ultoxy.com",
        "telephone": "+91-7776824564",
        "areaServed": ["IN", "Global"],
        "knowsAbout": [
          "Website Development",
          "Mobile App Development",
          "Enterprise ERP Software Development",
          "Digital Marketing",
          "Search Engine Optimization"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
